<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
  <meta name="theme-color" content="#111111">
  <title>TomCat Engine · Web Editor</title>
  <style>
    :root { color-scheme: dark; }
    html, body, #engineHost { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #202020; }
    #canvas { width: 100%; height: 100%; display: block; outline: 0; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; color: #d9d9d9; background: #202020; font: 14px/1.5 system-ui, sans-serif; transition: opacity .25s ease; }
    #loading.done { opacity: 0; }
    #loading .card { min-width: 260px; padding: 22px 26px; border: 1px solid #424242; border-radius: 8px; background: #292929; box-shadow: 0 12px 40px #0008; }
    #loading strong { display: block; margin-bottom: 6px; color: #fff; font-size: 16px; }
    #loading.error { color: #ffb4b4; pointer-events: auto; }
    #loading.error .card { border-color: #8f4444; }
    #hostStatus { position: fixed; left: 10px; bottom: 8px; z-index: 5; max-width: min(560px, calc(100vw - 20px)); padding: 4px 8px; border-radius: 4px; color: #b6e4bc; background: #101010aa; font: 11px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; pointer-events: none; transition: opacity .3s ease; }
    #hostStatus.hidden { opacity: 0; }
    #backToHub { position: fixed; top: 8px; right: 10px; z-index: 6; opacity: .16; color: #ddd; border: 1px solid #777; border-radius: 4px; padding: 3px 7px; background: #222a; font: 11px system-ui, sans-serif; text-decoration: none; transition: opacity .15s ease; }
    #backToHub:hover, #backToHub:focus { opacity: .95; }
    @media (max-width: 700px) { #backToHub { opacity: .75; } }
  </style>
</head>
<body>
  <div id="engineHost">
    <canvas id="canvas" tabindex="0" aria-label="TomCat Engine WebGL2 editor"></canvas>
  </div>
  <div id="loading"><div class="card"><strong>TomCat Engine</strong><span id="loadingText">正在加载上游编辑器…</span></div></div>
  <div id="hostStatus" aria-live="polite">准备浏览器文件系统…</div>
  <a id="backToHub" href="../hub/" title="返回 TomCat Hub">Hub</a>

  <script src="../shared/bridge.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/platform.js"></script>
  <script src="../shared/engine-runtime.js"></script>
  <script src="./tomcat_web_module.js"></script>
  <script>
    (function () {
      "use strict";
      const loading = document.getElementById("loading");
      const loadingText = document.getElementById("loadingText");
      const status = document.getElementById("hostStatus");
      const canvas = document.getElementById("canvas");
      const params = new URLSearchParams(location.search);
      const setStatus = (value, hidden) => { status.textContent = value; status.classList.toggle("hidden", !!hidden); };
      const fail = (error) => {
        const message = error && error.message ? error.message : String(error);
        loading.classList.add("error"); loadingText.textContent = `启动失败：${message}`;
        setStatus(message, false); console.error(error);
      };

      if (typeof TomCatWebModule !== "function" || !window.TomCatEngineHost) {
        fail(new Error("WASM 编辑器资源未找到，请先完成 Emscripten 构建"));
        return;
      }

      const projectId = params.get("project");
      const project = (window.TomCatStore && (window.TomCatStore.get(projectId) || window.TomCatStore.list()[0])) || null;
      if (project) {
        document.title = `${project.name} · TomCat Engine`;
        document.getElementById("backToHub").href = `../hub/?project=${encodeURIComponent(project.id)}`;
      }

      const runtime = new window.TomCatEngineHost.EngineRuntime({ canvas, project });
      window.TomCatRuntime = runtime;
      window.TomCatRuntimeReady = runtime.ready;
      window.addEventListener("tomcat:engine:log", (event) => setStatus(event.detail || "", false));
      window.addEventListener("tomcat:engine:error", (event) => setStatus(event.detail || "引擎错误", false));

      runtime.ready.then(() => {
        loading.classList.add("done");
        setStatus(`上游 EditorLayer · WebGL2 · ${project ? project.name : "Untitled Project"}`, false);
        window.setTimeout(() => setStatus("", true), 2600);
        canvas.focus();
      }).catch(fail);
    })();
  </script>
</body>
</html>
