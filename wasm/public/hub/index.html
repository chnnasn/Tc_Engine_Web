<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TomCat Hub</title><link rel="stylesheet" href="../shared/theme.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">TC</span> TomCat Hub</div><nav class="nav"><a class="active" href="./">⌂　项目总览</a><a href="#resources">▦　资源库</a><a href="#activity">◷　最近活动</a><a href="../editor/">▣　打开编辑器</a></nav><div style="position:absolute;bottom:20px;padding:0 8px;color:var(--muted);font-size:12px">Web compatibility layer<br><span class="badge good">bridge ready</span></div></aside>
<main class="workspace"><header class="topbar"><div><h1>项目总览</h1><div class="muted">管理项目、资源和 Web 编辑会话</div></div><div class="toolbar"><input id="search" class="search" placeholder="搜索项目或标签"><button class="primary" id="newProject">＋ 新建项目</button></div></header>
<section class="stat-row"><div class="stat"><span class="muted">项目</span><b id="projectCount">0</b></div><div class="stat"><span class="muted">资源文件</span><b id="assetCount">0</b></div><div class="stat"><span class="muted">本周编辑时长</span><b>4.2h</b></div><div class="stat"><span class="muted">运行目标</span><b>Web + GLFW</b></div></section>
<section><div class="topbar" style="margin-bottom:14px"><div><h2 style="margin:0;font-size:18px">我的项目</h2><span class="muted">选择项目继续创作</span></div><select id="sort"><option value="updated">最近更新</option><option value="name">名称</option></select></div><div id="projects" class="cards"></div></section>
<section id="resources" style="margin-top:32px"><div class="topbar" style="margin-bottom:14px"><div><h2 style="margin:0;font-size:18px">资源库</h2><span class="muted">统一浏览项目中的场景、纹理和脚本</span></div><button id="importAsset">导入资源</button><input id="assetPicker" type="file" multiple hidden></div><div class="table"><div class="table-row table-head"><span>资源</span><span>类型</span><span>所属项目</span><span>状态</span></div><div id="assets"></div></div></section>
</main></div><div class="modal" id="modal"><form class="dialog" id="projectForm"><h2>新建项目</h2><label class="field">项目名称<input name="name" required placeholder="例如：星际农场"></label><label class="field">模板<select name="template"><option>2D 空项目</option><option>平台跳跃</option><option>俯视角冒险</option></select></label><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary">创建并打开</button></div></form></div><script src="../shared/bridge.js"></script><script src="./app.js"></script></body></html>
