<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TomCat Editor</title><link rel="stylesheet" href="../shared/theme.css"><style>
.editor{height:100vh;display:grid;grid-template-rows:52px 1fr 170px;grid-template-columns:235px 1fr 270px}.editor .top{grid-column:1/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 15px;background:#101a30}.editor .top strong{margin-right:auto}.pane{border-right:1px solid var(--line);background:#10182a;overflow:auto}.pane.right{border-left:1px solid var(--line);border-right:0}.pane-title{padding:13px 14px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.tree{padding:9px}.tree div{padding:8px 9px;border-radius:6px}.tree div.active,.tree div:hover{background:#1c2c4c}.canvas{position:relative;padding:24px;overflow:hidden;background:#0b1222}.canvas-grid{height:100%;border:1px solid #30446b;border-radius:8px;background-color:#0e172b;background-image:linear-gradient(#162544 1px,transparent 1px),linear-gradient(90deg,#162544 1px,transparent 1px);background-size:32px 32px;display:grid;place-items:center}.scene{width:62%;aspect-ratio:16/9;border:1px solid #73a7ff;background:linear-gradient(135deg,#20315a,#262247);box-shadow:0 0 0 5px #72a7ff22;position:relative}.scene:before{content:'2D Scene Preview';position:absolute;top:12px;left:14px;color:#bfd4ff;font-size:12px}.gizmo{position:absolute;left:50%;top:50%;width:50px;height:50px;border-left:2px solid #ff657c;border-top:2px solid #6ef2b2}.bottom{grid-column:1/-1;border-top:1px solid var(--line);background:#0e172a;padding:0 14px}.assets{display:flex;gap:10px;padding:10px 0;overflow:auto}.asset{min-width:100px;border:1px solid var(--line);border-radius:7px;padding:9px;color:var(--muted);font-size:12px}.inspector{padding:13px}.prop{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #1c2942;padding:9px 0;color:var(--muted)}.prop input{width:110px;background:#0b1325;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px}.transport{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}.status{font-size:12px;color:var(--good);margin-left:auto}@media(max-width:850px){.editor{grid-template-columns:180px 1fr;}.pane.right{display:none}}
</style></head><body><div class="editor"><header class="top"><a href="../hub/" style="color:var(--text);text-decoration:none">← Hub</a><strong id="projectName">Untitled Project</strong><button id="save">保存</button><button class="primary" id="run">▶ 运行</button><span class="status" id="bridgeStatus">● Bridge ready</span></header><aside class="pane"><div class="pane-title">Scene hierarchy</div><div class="tree"><div class="active">▾ MainScene</div><div style="padding-left:24px">◇ Camera</div><div style="padding-left:24px">◇ Player</div><div style="padding-left:24px">◇ DirectionalLight</div><div>▸ UI</div></div><div class="pane-title">注册能力</div><div class="tree muted"><div>scene.open</div><div>scene.save</div><div>asset.import</div><div>runtime.play</div></div></aside><main class="canvas"><div class="canvas-grid"><div class="scene"><div class="gizmo"></div></div></div></main><aside class="pane right"><div class="pane-title">Inspector</div><div class="inspector"><h3 style="margin:4px 0 12px">Player</h3><div class="prop"><span>Position X</span><input value="0"></div><div class="prop"><span>Position Y</span><input value="0"></div><div class="prop"><span>Scale</span><input value="1.0"></div><div class="prop"><span>Visible</span><input type="checkbox" checked></div></div></aside><section class="bottom"><div class="transport"><button id="pause">Ⅱ</button><button id="step">▷|</button><span class="muted">编辑器预览</span><span class="status">Web + GLFW 双向通道</span></div><div class="assets"><div class="asset">▧ MainScene.scene</div><div class="asset">▣ player.png</div><div class="asset">▤ PlayerController.lua</div><div class="asset">＋ 导入资源</div></div></section></div><script src="../shared/bridge.js"></script><script src="./app.js"></script></body></html>
