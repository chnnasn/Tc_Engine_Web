name: Build Web

on:
  push:
  pull_request:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [tomcat-engine-updated]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test bridge/*.test.mjs
      - run: npm ci
      - run: npm run build

  build-wasm:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:4.0.15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned engine with recursive submodules
        run: python3 scripts/fetch_engine.py
      - name: Configure
        run: emcmake cmake -S wasm -B build/wasm -DTOMCAT_WEB_EMSCRIPTEN=ON -DTOMCAT_ENGINE_SOURCE=$GITHUB_WORKSPACE/.engine/TomCat_Engine
      - name: Build
        run: cmake --build build/wasm --config Release
      - name: Stage generated WASM runtime for Vite
        run: |
          mkdir -p wasm/public/runtime
          cp build/wasm/tomcat_web_module.js wasm/public/runtime/
          cp build/wasm/tomcat_web_module.wasm wasm/public/runtime/
          cp build/wasm/tomcat_web_module.data wasm/public/runtime/
      - name: Smoke test module exports
        run: |
          cd build/wasm
          node -e "const f=require('./tomcat_web_module.js'); f({locateFile:p=>'./'+p,noInitialRun:true}).then(m=>{for(const n of ['_tc_web_runtime_boot','_tc_web_runtime_frame','_tc_web_runtime_shutdown','_tc_web_boot','_tc_web_platform_resize','_tc_web_storage_mount','_tc_web_storage_sync','_tc_web_project_create','_tc_web_scene_save']) if(typeof m[n]!=='function') throw new Error('missing export '+n); if(!m.HEAPU8) throw new Error('HEAPU8 runtime export missing'); console.log('module exports ok');}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Build React frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tc-engine-web
          path: dist
      - name: Deploy to Netlify
        if: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.event_name != 'push') }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            npx --yes netlify-cli deploy --dir=dist --prod
          else
            echo "Netlify secrets are not configured; skipping deployment."
          fi
