<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>TomCat Hub</title>
  <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
  <style>
    :root { color-scheme: dark; }
    html, body, #engineHost { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #141414; }
    #canvas { width: 100%; height: 100%; display: block; outline: 0; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; color: #d9d9d9; background: #141414; font: 14px/1.5 system-ui, sans-serif; transition: opacity .25s ease; }
    #loading.done { opacity: 0; }
    #loading .card { min-width: 260px; padding: 22px 26px; border: 1px solid #424242; border-radius: 8px; background: #202020; box-shadow: 0 12px 40px #0008; }
    #loading strong { display: block; margin-bottom: 6px; color: #fff; font-size: 16px; }
    #loading.error { color: #ffb4b4; pointer-events: auto; }
    #loading.error .card { border-color: #8f4444; }
    #hostStatus { position: fixed; left: 10px; bottom: 8px; z-index: 5; max-width: min(620px, calc(100vw - 20px)); padding: 4px 8px; border-radius: 4px; color: #b6e4bc; background: #101010aa; font: 11px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; pointer-events: none; transition: opacity .3s ease; }
    #hostStatus.hidden { opacity: 0; }
    @media (max-width: 700px) { #hostStatus { display: none; } }
  </style>
</head>
<body>
  <div id="engineHost">
    <canvas id="canvas" tabindex="0" aria-label="TomCat Engine WebGL2 Hub"></canvas>
  </div>
  <div id="loading"><div class="card"><strong>TomCat Hub</strong><span id="loadingText">正在加载上游 Hub…</span></div></div>
  <div id="hostStatus" aria-live="polite">准备浏览器文件系统…</div>

  <script src="../shared/bridge.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/platform.js"></script>
  <script src="../shared/engine-runtime.js"></script>
  <script src="../runtime/tomcat_web_module.js"></script>
  <script>
    (function () {
      "use strict";
      const loading = document.getElementById("loading");
      const loadingText = document.getElementById("loadingText");
      const status = document.getElementById("hostStatus");
      const canvas = document.getElementById("canvas");
      const setStatus = (value, hidden) => { status.textContent = value; status.classList.toggle("hidden", !!hidden); };
      const fail = (error) => {
        const message = error && error.message ? error.message : String(error);
        loading.classList.add("error"); loadingText.textContent = `启动失败：${message}`;
        setStatus(message, false); console.error(error);
      };

      if (typeof TomCatWebModule !== "function" || !window.TomCatEngineHost?.HubRuntime) {
        fail(new Error("WASM 模块未找到。请在 wasm/public 目录下启动静态服务并先完成 Emscripten 构建"));
        return;
      }

      const runtime = new window.TomCatEngineHost.HubRuntime({ canvas, modulePath: "../runtime/" });
      window.TomCatHubRuntime = runtime;
      window.TomCatHubReady = runtime.ready;
      window.addEventListener("tomcat:engine:log", (event) => setStatus(event.detail || "", false));
      window.addEventListener("tomcat:engine:error", (event) => setStatus(event.detail || "引擎错误", false));

      runtime.ready.then(() => {
        loading.classList.add("done");
        setStatus("上游 TomCat Hub · WebGL2 · 项目目录就绪", false);
        window.setTimeout(() => setStatus("", true), 3000);
        canvas.focus();
      }).catch(fail);
    })();
  </script>
</body>
</html>
