<!doctype html><canvas id="c" width="1280" height="720"></canvas><pre id="o"></pre><script>
const c=document.getElementById('c'), o=document.getElementById('o'), gl=c.getContext('webgl2',{antialias:false}); const out=[];
if(!gl){o.textContent='NO WEBGL2';} else { out.push('webgl2 '+gl.getParameter(gl.VERSION)); out.push('maxColor '+gl.getParameter(gl.MAX_COLOR_ATTACHMENTS)+' maxDraw '+gl.getParameter(gl.MAX_DRAW_BUFFERS));
function run(label, integer, depthFmt){const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); let fmt=integer?gl.RED_INTEGER:gl.RGBA, internal=integer?gl.R32I:gl.RGBA8, type=integer?gl.INT:gl.UNSIGNED_BYTE; gl.texImage2D(gl.TEXTURE_2D,0,internal,1280,720,0,fmt,type,null); let e1=gl.getError(); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0); let r=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,r); gl.renderbufferStorage(gl.RENDERBUFFER,depthFmt,1280,720); let e2=gl.getError(); gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_STENCIL_ATTACHMENT,gl.RENDERBUFFER,r); let e3=gl.getError(); gl.drawBuffers([gl.COLOR_ATTACHMENT0]); let e4=gl.getError(); let s=gl.checkFramebufferStatus(gl.FRAMEBUFFER); out.push(label+' status=0x'+s.toString(16)+' errs='+[e1,e2,e3,e4]); gl.deleteTexture(t);gl.deleteRenderbuffer(r);gl.deleteFramebuffer(f);}
run('rgba+ds',false,gl.DEPTH24_STENCIL8); run('rgba+depth24',false,gl.DEPTH_COMPONENT24); run('r32i+ds',true,gl.DEPTH24_STENCIL8); o.textContent=out.join('\\n'); }
</script>
